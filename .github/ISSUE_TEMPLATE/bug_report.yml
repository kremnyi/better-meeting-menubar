name: Bug report
description: Something in Better Meeting did not work as described.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: App version
      description: From the About page in the menu, for example 0.4.6b2 (120).
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac
      placeholder: macOS 15.8, MacBook Pro M1 Pro
    validations:
      required: true
  - type: dropdown
    id: engine
    attributes:
      label: Transcription engine
      options: [Parakeet v3, Whisper, Not related to transcription]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. Attach a screenshot if the menu showed an error.
    validations:
      required: true
