name: Build and check

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# One job: GitHub is sometimes short of macOS runners, so the tests and the app bundle ask for one runner, not two.
jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Cache SwiftPM dependencies
        uses: actions/cache@v6
        with:
          path: |
            .build/checkouts
            .build/artifacts
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-
      - name: Run the tests
        run: |
          swift test
          xcrun swift scripts/test-update-signature.swift
      # This step also runs after a test failure, so one run reports both results.
      - name: Build the app bundle
        if: ${{ !cancelled() }}
        run: ./scripts/build-app.sh
      - name: Save crash reports if a check fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: crash-reports
          path: ~/Library/Logs/DiagnosticReports/*
          if-no-files-found: ignore
