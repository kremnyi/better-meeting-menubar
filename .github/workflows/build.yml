name: Build and check

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Each matrix entry runs on its own runner, so the tests and the app bundle
# run in parallel and a push finishes in the longer of the two, not their sum.
jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: tests
            run: |
              swift test
              xcrun swift scripts/test-update-signature.swift
          - name: bundle
            run: ./scripts/build-app.sh
    steps:
      - uses: actions/checkout@v7
      - name: Cache SwiftPM dependencies
        uses: actions/cache@v6
        with:
          path: |
            .build/checkouts
            .build/artifacts
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-
      - name: Run ${{ matrix.name }}
        run: ${{ matrix.run }}
      - name: Save crash reports if a check fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}-crash-reports
          path: ~/Library/Logs/DiagnosticReports/*
          if-no-files-found: ignore
